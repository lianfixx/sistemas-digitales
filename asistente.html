<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente digital para negocios · Sistemas Digitales</title><style>:root{--bg:#faf9f6;--ink:#181818;--muted:#686868;--line:#deddd7;--orange:#ff6700;--peach:#fecb8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:36px 22px}.top{display:flex;justify-content:space-between;gap:15px}.top a,.cta{color:var(--ink);text-decoration:underline;text-underline-offset:4px}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:.7rem;color:#777}h1{font-size:clamp(2.8rem,7vw,5.5rem);letter-spacing:-.06em;line-height:1;margin:25px 0}h2{font-size:2rem}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.filters button{border:1px solid var(--line);background:white;padding:9px 15px;border-radius:30px;cursor:pointer}.filters button[aria-pressed=true]{background:#222;color:white}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);background:white;padding:18px;text-align:left;cursor:pointer;border-radius:8px;min-height:126px}.card[aria-pressed=true]{background:#efeee9;border-color:#aaa}.num{color:var(--orange);font-size:.72rem;font-weight:bold}.card b{display:block;font-size:1rem;margin:6px 0}.card small{color:#777}.detail{position:sticky;top:20px;background:white;border:1px solid var(--line);padding:25px;border-radius:8px}.detail h2{margin:8px 0}.detail p{color:var(--muted)}.detail h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;margin:20px 0 0}.detail .rule{border-left:3px solid var(--orange);padding-left:13px}.cta{display:inline-block;margin-top:22px;background:#171717;color:white;padding:13px 18px;border-radius:30px;text-decoration:none}.foot{margin-top:60px;border-top:1px solid var(--line);padding-top:20px;color:#777;font-size:.82rem}@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{position:static}.cards{grid-template-columns:1fr 1fr}}@media(max-width:460px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="index.html">sistemas digitales. · Inicio</a><a href="index.html#planes">Volver a planes</a></div><p class="eyebrow">Sistemas Digitales · FORJA</p><h1>Asistente digital<br>para negocios.</h1><p style="font-size:1.25rem">Tu asistente. Tus reglas.</p><p>Elige qué necesitas resolver.</p><div class="filters"><button data-filter="Todos" aria-pressed="true">Todos</button><button data-filter="Confianza" aria-pressed="false">Confianza</button><button data-filter="Conversión" aria-pressed="false">Conversión</button><button data-filter="Operación" aria-pressed="false">Operación</button></div><div class="layout"><div class="cards" id="cards"></div><aside class="detail" id="detail" aria-live="polite"></aside></div><a class="cta" href="index.html#planes">Elegir Sistema ↗</a><footer class="foot">sistemas digitales. · Licencias y canales según el alcance contratado. <a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Condiciones</a></footer></main>
<script>
const data=[
["Blindaje anti-invento","Confianza","Si el dato no está respaldado, el asistente no lo afirma.","Un precio, horario o condición inventados pueden costar dinero y confianza.","Consulta la información autorizada, verifica afirmaciones sensibles y pide ayuda humana cuando falta respaldo.","FORJA publica búsqueda de cinco pasajes, umbral de confianza de 0.7 y radar de dudas de 30 días."],
["Vigilante con IA","Confianza","Lee la conversación terminada y avisa cuando algo requiere atención.","Una molestia o una venta en riesgo suele descubrirse cuando la persona ya se fue.","Califica calidad, sentimiento y resolución; muestra señales operativas en el panel y activa avisos relevantes.","FORJA publica calificación de 1 a 5, ocho dimensiones y alertas de salud ante fallas repetidas."],
["Handoff que sí atina","Confianza","Entrega la conversación a una persona con el contexto completo.","Un bot que nunca cede frustra; uno que escala todo interrumpe al equipo.","Crea un ticket con el motivo, avisa al responsable y se aparta mientras la persona atiende.","FORJA publica escalamiento por solicitud humana, queja, facturación, tema legal o tres vueltas sin resolver."],
["Cazador de ventas","Conversión","Recupera una conversación que se enfrió sin perseguir al prospecto.","Muchas oportunidades mueren después de preguntar precio o disponibilidad.","Detecta interés real, espera y redacta un único seguimiento breve con la voz del negocio.","FORJA publica una ventana de 3 a 20 horas, un toque por conversación y un máximo de 30 al día."],
["Oído y vista","Operación","Entiende notas de voz e imágenes dentro de la misma conversación.","Audios, comprobantes, ubicaciones y fotos suelen romper el recorrido de un bot básico.","Transcribe el audio, interpreta la imagen y responde con el contexto que ya existe en el chat.","FORJA publica audio con Whisper y visión para WhatsApp, Instagram, Messenger y Telegram."],
["Voz de marca","Confianza","Responde con el tono del negocio sin tocar sus frenos de seguridad.","Una respuesta de call center rompe la cercanía que el negocio construyó.","Define tuteo, energía, longitud y estilo a partir de mensajes y materiales reales.","FORJA publica tres presets y un retrato de voz que cambia personalidad, no disciplina."],
["Reportes automáticos","Operación","Resume conversaciones, prospectos y resultados sin revisar chat por chat.","Sin una lectura diaria, el equipo opera por sensación y pierde señales importantes.","Entrega un resumen por WhatsApp o correo con actividad y oportunidades que necesitan seguimiento.","La información depende de los eventos realmente registrados y de la medición configurada."],
["Multi-idioma","Conversión","Continúa en español, inglés o portugués según el idioma del cliente.","Cambiar de idioma puede cortar una venta o retrasar una respuesta sencilla.","Detecta el idioma y mantiene la misma información, reglas y siguiente paso.","FORJA publica español, inglés y portugués dentro del mismo asistente."],
["Encuestas de satisfacción","Operación","Pide una calificación breve y detecta una mala experiencia a tiempo.","Si nadie pregunta, una fricción termina convertida en abandono o mala reseña.","Solicita una valoración del 1 al 5 y avisa al equipo cuando la respuesta requiere atención.","La encuesta se activa después de una atención definida y conserva salida humana."],
["Recupera no-shows","Conversión","Retoma una cita perdida con un mensaje respetuoso y una nueva opción.","Una ausencia no siempre es desinterés; muchas veces es olvido o un horario imposible.","Detecta la cita no atendida, ofrece reagendar y registra la nueva decisión.","La ventana, frecuencia y tono se acuerdan con el negocio antes de activar el seguimiento."],
["Pide reseñas","Conversión","Invita a compartir una experiencia positiva en el momento correcto.","Los clientes satisfechos rara vez dejan reseña si nadie facilita el paso.","Después de una valoración positiva, comparte el enlace autorizado de Google.","Requiere el perfil y enlace del negocio; nunca inventa, compra o condiciona reseñas."],
["Cobros por WhatsApp","Conversión","Envía un enlace de pago y confirma el estado sin pedir datos de tarjeta por chat.","Perseguir anticipos manualmente retrasa reservaciones y aumenta errores.","Comparte el checkout del prestador, escucha la confirmación del proveedor y actualiza el caso.","Requiere Stripe conectado a la cuenta del negocio y webhooks verificados; FORJA no procesa el dinero."]
];
let active=0,filter="Todos";
function draw(){const shown=data.map((x,i)=>({...x,i})).filter(x=>filter==="Todos"||x[1]===filter);document.getElementById("cards").innerHTML=shown.map(x=>'<button class="card" data-i="'+x.i+'" aria-pressed="'+(x.i===active)+'"><span class="num">'+String(x.i+1).padStart(2,"0")+'</span><b>'+x[0]+'</b><small>'+x[1]+'</small></button>').join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{active=+b.dataset.i;draw()});const x=data[active];document.getElementById("detail").innerHTML='<span class="num">'+String(active+1).padStart(2,"0")+' / 12 · '+x[1]+'</span><h2>'+x[0]+'</h2><p>'+x[2]+'</p><h3>Lo que evita</h3><p>'+x[3]+'</p><h3>Cómo se usa</h3><p>'+x[4]+'</p><h3>Regla visible</h3><p class="rule">'+x[5]+'</p><p><a href="index.html#asistente">Verlo dentro de una conversación →</a></p>'}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()});draw();
</script></body></html>
